<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C79A34">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nirvana Café">
<title>Menu — Nirvana Café</title>
<!--
  MENU PUBLIC (cible du QR code fixe).
  - Lit la table `menu` de Supabase (dynamique).
  - Fonctionne hors-ligne : garde en cache la dernière carte chargée.
  - Boutons permanents : Appeler (tel:) et Itinéraire (Google Maps).
  Fichiers requis à côté : config.js  (+ SDK Supabase via CDN, chargé si réseau).
-->
<style>
  :root{
    --bg:#C79A34; --card:#FBF4E2; --card2:#F4EAD0; --line:#E4D3A0;
    --ink:#3A2C0C; --brown:#5A4A22; --dim:#8A7742; --ocre:#C79A34; --ocre-deep:#8A6D1F;
    --green:#2E7D32; --red:#B3261E;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:linear-gradient(160deg,#C79A34,#A8801F);color:var(--ink);min-height:100vh;
    padding:0 0 96px;}
  .head{text-align:center;padding:34px 20px 22px;}
  .logo{width:78px;height:78px;border-radius:50%;margin:0 auto 12px;
    background:radial-gradient(circle at 30% 30%,#E7C063,#8A6D1F);
    display:flex;align-items:center;justify-content:center;font-size:34px;color:#2A2005;
    box-shadow:0 6px 20px rgba(42,32,5,.35);}
  .head h1{font-size:30px;letter-spacing:.5px;color:#2A2005;}
  .head .sub{font-size:13px;letter-spacing:3px;text-transform:uppercase;color:#5A4A22;margin-top:4px;}
  .wrap{max-width:640px;margin:0 auto;padding:0 16px;}
  .banner{background:#F7DBE2;border:1.5px solid #E8AEBD;color:#8A2A3A;border-radius:12px;
    padding:10px 14px;font-size:13px;font-weight:700;text-align:center;margin-bottom:14px;}
  .cat{margin:22px 0 10px;display:flex;align-items:center;gap:10px;}
  .cat h2{font-size:20px;color:#2A2005;}
  .cat .rule{flex:1;height:2px;background:rgba(42,32,5,.18);border-radius:2px;}
  .item{background:var(--card);border:1.5px solid var(--line);border-radius:14px;
    padding:14px 16px;margin-bottom:10px;box-shadow:0 3px 10px rgba(58,44,12,.14);
    display:flex;gap:12px;align-items:flex-start;}
  .item.indispo{opacity:.55;}
  .item .info{flex:1;}
  .item .thumb{width:70px;height:70px;border-radius:12px;background-size:cover;background-position:center;flex-shrink:0;
    border:1.5px solid var(--line);cursor:pointer;box-shadow:0 2px 8px rgba(58,44,12,.16);}
  .item .thumb:active{transform:scale(.96);}
  .lb{position:fixed;top:0;right:0;bottom:0;left:0;z-index:2000;background:rgba(18,12,2,.82);
    display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;visibility:hidden;pointer-events:none;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:opacity .22s ease, visibility .22s;}
  .lb.open{opacity:1;visibility:visible;pointer-events:auto;}
  .lb .lb-inner{max-width:600px;width:100%;text-align:center;transform:scale(.9) translateY(10px);
    transition:transform .26s cubic-bezier(.2,.9,.3,1.2);}
  .lb.open .lb-inner{transform:scale(1) translateY(0);}
  .lb img{max-width:100%;max-height:72vh;border-radius:20px;box-shadow:0 24px 70px rgba(0,0,0,.6);background:#000;}
  .lb .lb-nom{color:#F6E7B8;font-weight:800;font-size:20px;margin-top:16px;text-shadow:0 2px 10px rgba(0,0,0,.5);}
  .lb .lb-x{position:absolute;top:16px;right:18px;background:rgba(255,255,255,.16);color:#fff;border:none;border-radius:14px;
    width:48px;height:48px;font-size:22px;font-weight:800;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);transition:.15s;}
  .lb .lb-x:active{transform:scale(.9);background:rgba(255,255,255,.28);}
  @keyframes itemIn{from{opacity:0;transform:translateY(16px) scale(.985);}to{opacity:1;transform:none;}}
  @keyframes catIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .item{animation:itemIn .5s cubic-bezier(.2,.7,.2,1) both;transition:transform .18s ease, box-shadow .25s ease;}
  .item:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(58,44,12,.24);}
  .item .thumb{transition:transform .25s ease, box-shadow .25s ease;}
  .item .thumb:hover{transform:scale(1.05);box-shadow:0 8px 22px rgba(58,44,12,.3);}
  .cat{animation:catIn .45s ease both;}
  @media (prefers-reduced-motion: reduce){ .item,.cat{animation:none !important;} }
  .item .nom{font-weight:800;font-size:16px;}
  .item .desc{font-size:13px;color:var(--dim);margin-top:3px;line-height:1.4;}
  .item .prix{font-weight:800;font-size:16px;color:var(--ocre-deep);white-space:nowrap;}
  .item .tag{display:inline-block;font-size:10px;font-weight:800;color:#fff;background:var(--red);
    border-radius:8px;padding:2px 7px;margin-top:5px;}
  .loading,.empty{text-align:center;color:#5A4A22;padding:40px 16px;font-weight:600;}
  .spin{width:34px;height:34px;border:4px solid rgba(42,32,5,.2);border-top-color:#5A4A22;
    border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 14px;}
  @keyframes sp{to{transform:rotate(360deg);}}
  .actions{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;padding:12px 16px;
    padding-bottom:calc(12px + env(safe-area-inset-bottom));
    background:rgba(251,244,226,.96);backdrop-filter:blur(8px);border-top:1.5px solid var(--line);}
  .actions a{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
    text-decoration:none;font-weight:800;font-size:16px;border-radius:14px;padding:15px;min-height:54px;}
  .btn-call{background:var(--green);color:#fff;}
  .btn-map{background:var(--ocre-deep);color:#FBF4E2;}
  .actions a:active{transform:scale(.97);}
  .foot{text-align:center;font-size:12px;color:#5A4A22;padding:22px 16px 4px;}

  /* ══ Allergènes ══ */
  #filtre{margin:0 auto 14px;max-width:640px;padding:0 16px;}
  .filtre-t{font-size:12px;color:var(--txt-dim,#8a7f6d);margin-bottom:7px;text-align:center;}
  .filtre-l{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;}
  .pill{border:1.5px solid rgba(212,163,74,.45);background:transparent;color:inherit;
    border-radius:16px;padding:5px 11px;font-size:12px;cursor:pointer;font-family:inherit;
    transition:.15s;}
  .pill:active{transform:scale(.95);}
  .pill-off{background:rgba(220,38,38,.16);border-color:#dc2626;font-weight:700;}
  .pill-reset{background:rgba(212,163,74,.2);font-weight:700;}
  .al{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;}
  .al-p{font-size:10px;padding:2px 7px;border-radius:10px;background:rgba(212,163,74,.14);
    border:1px solid rgba(212,163,74,.3);white-space:nowrap;}
  .al-ok{background:rgba(34,197,94,.14);border-color:rgba(34,197,94,.4);}
  .al-nc{background:rgba(245,158,11,.14);border-color:rgba(245,158,11,.45);}
  .fm{font-size:10px;padding:2px 6px;border-radius:8px;background:rgba(34,197,94,.16);
    border:1px solid rgba(34,197,94,.4);font-weight:600;vertical-align:middle;}
  .orig{font-size:11px;color:var(--txt-dim,#8a7f6d);margin-top:3px;font-style:italic;}
  .masq{text-align:center;font-size:12px;color:var(--txt-dim,#8a7f6d);margin:14px 0;}
  .mentions{max-width:640px;margin:26px auto 10px;padding:12px 16px;font-size:11px;line-height:1.6;
    color:var(--txt-dim,#8a7f6d);border-top:1px solid rgba(212,163,74,.25);text-align:center;}
</style>
</head>
<body>
  <div class="head">
    <div class="logo">✦</div>
    <h1 id="resto-nom">Nirvana Café</h1>
    <div class="sub" id="resto-adr">Cuisine & saveurs</div>
  </div>

  <div class="wrap">
    <div id="banner"></div>
  <div id="filtre"></div>
    <div id="menu"><div class="loading"><div class="spin"></div>Chargement de la carte…</div></div>
    <div class="foot">Carte mise à jour en temps réel · Merci de votre visite ✦</div>
  </div>

  <div class="actions">
    <a class="btn-call" id="btn-call" href="#">📞 Appeler</a>
    <a class="btn-map"  id="btn-map"  href="#" target="_blank" rel="noopener">📍 Itinéraire</a>
  </div>

  <div class="lb" id="lb" onclick="closeLb()">
    <button class="lb-x" onclick="closeLb()">✕</button>
    <div class="lb-inner" onclick="event.stopPropagation()"><img id="lb-img" src="" alt=""><div class="lb-nom" id="lb-nom"></div></div>
  </div>

  <script src="config.js" onerror="console.log('config.js absent')"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="console.log('SDK hors-ligne')"></script>
  <script>
  (function(){
    'use strict';
    var TEL  = window.NIRVANA_TEL  || '+262692000000';
    var MAPS = window.NIRVANA_MAPS || 'https://maps.google.com/?q=Nirvana+Cafe';
    var NOM  = window.NIRVANA_NOM  || 'Nirvana Café';
    var ADR  = window.NIRVANA_ADRESSE || '';

    document.getElementById('resto-nom').textContent = NOM;
    if (ADR) document.getElementById('resto-adr').textContent = ADR;
    document.getElementById('btn-call').href = 'tel:' + TEL.replace(/\s/g,'');
    document.getElementById('btn-map').href  = MAPS;

    var CACHE_KEY = 'nirvana_menu_cache';

    /* ══ ALLERGÈNES (règlement INCO / décret 2015-447) ══
       Les 14 allergènes à déclaration obligatoire. Le client peut masquer les
       plats qui en contiennent — utile et rapide sur un téléphone. */
    var ALLERGENES = [
      {id:'gluten',ic:'🌾',nom:'Gluten'},        {id:'crustaces',ic:'🦐',nom:'Crustacés'},
      {id:'oeufs',ic:'🥚',nom:'Œufs'},           {id:'poissons',ic:'🐟',nom:'Poissons'},
      {id:'arachides',ic:'🥜',nom:'Arachides'},  {id:'soja',ic:'🌱',nom:'Soja'},
      {id:'lait',ic:'🥛',nom:'Lait'},            {id:'fruits_coq',ic:'🌰',nom:'Fruits à coque'},
      {id:'celeri',ic:'🥬',nom:'Céleri'},        {id:'moutarde',ic:'🟡',nom:'Moutarde'},
      {id:'sesame',ic:'⚪',nom:'Sésame'},        {id:'sulfites',ic:'🍷',nom:'Sulfites'},
      {id:'lupin',ic:'🌸',nom:'Lupin'},          {id:'mollusques',ic:'🐚',nom:'Mollusques'}
    ];
    var AL = {}; ALLERGENES.forEach(function(a){ AL[a.id]=a; });
    var exclus = [];        // allergènes que le client veut éviter
    var ITEMS = [];

    function alDe(i){ return Array.isArray(i.allergenes) ? i.allergenes : []; }

    /* Barre de filtre : n'affiche QUE les allergènes réellement présents sur la
       carte — inutile de proposer « lupin » si aucun plat n'en contient. */
    function renderFiltre(){
      var box = document.getElementById('filtre');
      var presents = {};
      ITEMS.forEach(function(i){ alDe(i).forEach(function(a){ presents[a]=1; }); });
      var liste = ALLERGENES.filter(function(a){ return presents[a.id]; });
      if (!liste.length){ box.innerHTML=''; return; }
      box.innerHTML = '<div class="filtre-t">Vous évitez un allergène ? Touchez-le pour masquer les plats concernés.</div>'
        + '<div class="filtre-l">'
        + liste.map(function(a){
            var on = exclus.indexOf(a.id) > -1;
            return '<button class="pill'+(on?' pill-off':'')+'" onclick="toggleAl(\''+a.id+'\')">'
              + a.ic+' '+escapeHtml(a.nom)+(on?' ✕':'')+'</button>';
          }).join('')
        + (exclus.length ? '<button class="pill pill-reset" onclick="resetAl()">Tout afficher</button>' : '')
        + '</div>';
    }
    function toggleAl(id){
      var k = exclus.indexOf(id);
      if (k > -1) exclus.splice(k,1); else exclus.push(id);
      renderFiltre(); renderItems();
    }
    function resetAl(){ exclus = []; renderFiltre(); renderItems(); }

    function render(items, offline){
      ITEMS = items || [];
      var banner = document.getElementById('banner');
      banner.innerHTML = offline
        ? '<div class="banner">📴 Hors-ligne — carte affichée depuis le cache (dernière version connue)</div>'
        : '';
      renderFiltre();
      renderItems();
    }

    function renderItems(){
      var box = document.getElementById('menu');
      if (!ITEMS.length){
        box.innerHTML = '<div class="empty">La carte est momentanément indisponible.</div>';
        return;
      }
      var visibles = ITEMS.filter(function(i){
        return !alDe(i).some(function(a){ return exclus.indexOf(a) > -1; });
      });
      var masques = ITEMS.length - visibles.length;

      if (!visibles.length){
        box.innerHTML = '<div class="empty">Aucun plat ne correspond à vos critères.<br>'
          + '<button class="pill pill-reset" style="margin-top:10px" onclick="resetAl()">Tout afficher</button></div>';
        return;
      }
      var groups = {};
      visibles.forEach(function(i){ (groups[i.categorie||'Divers'] = groups[i.categorie||'Divers'] || []).push(i); });
      var html = '';
      var _n = 0;
      Object.keys(groups).forEach(function(cat){
        html += '<div class="cat"><h2>'+escapeHtml(cat)+'</h2><div class="rule"></div></div>';
        groups[cat].forEach(function(i){
          var dispo = i.disponible !== false;
          var a = alDe(i);
          var delay = Math.min(_n,10)*0.045; _n++;
          // Pastilles. Un plat non déclaré affiche « nous consulter » : on ne
          // laisse JAMAIS croire qu'il est sans allergène par défaut.
          var past = a.length
            ? '<div class="al">' + a.map(function(x){
                var o = AL[x] || {ic:'•',nom:x};
                return '<span class="al-p" title="'+escapeHtml(o.nom)+'">'+o.ic+' '+escapeHtml(o.nom)+'</span>';
              }).join('') + '</div>'
            : (i.allerg_declare
                ? '<div class="al"><span class="al-p al-ok">✓ Sans allergène majeur</span></div>'
                : '<div class="al"><span class="al-p al-nc">Allergènes : nous consulter</span></div>');
          html += '<div class="item'+(dispo?'':' indispo')+'" style="animation-delay:'+delay.toFixed(3)+'s">'
            + (i.photo ? '<div class="thumb" style="background-image:url(\''+escapeHtml(i.photo)+'\')" onclick="openLb(\''+escapeHtml(i.photo)+'\',\''+escapeHtml(i.nom)+'\')"></div>' : '')
            + '<div class="info"><div class="nom">'+escapeHtml(i.nom)
            + (i.fait_maison ? ' <span class="fm">🍳 Fait maison</span>' : '') + '</div>'
            + (i.description ? '<div class="desc">'+escapeHtml(i.description)+'</div>' : '')
            + (i.origine_viande ? '<div class="orig">Origine viande : '+escapeHtml(i.origine_viande)+'</div>' : '')
            + past
            + (dispo ? '' : '<span class="tag">Indisponible</span>')
            + '</div><div class="prix">'+formatPrix(i.prix)+'</div></div>';
        });
      });
      if (masques) html += '<div class="masq">'+masques+' plat(s) masqué(s) par votre filtre · '
        + '<button class="pill pill-reset" onclick="resetAl()">Tout afficher</button></div>';
      html += '<div class="mentions">Nos plats sont préparés dans une cuisine qui manipule '
        + 'l\'ensemble des allergènes listés : la présence de traces ne peut être exclue.<br>'
        + 'Une question sur un ingrédient ? Demandez-nous, nous vous renseignons.</div>';
      box.innerHTML = html;
    }

    function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
    function openLb(src,nom){ var lb=document.getElementById('lb'); document.getElementById('lb-img').src=src; document.getElementById('lb-nom').textContent=nom||''; lb.classList.add('open'); }
    function closeLb(){ var lb=document.getElementById('lb'); lb.classList.remove('open'); document.getElementById('lb-img').src=''; }
    function formatPrix(n){ return (Math.round((+n||0)*100)/100).toFixed(2).replace('.',',')+' €'; }

    function loadFromCache(){
      try { var c = localStorage.getItem(CACHE_KEY); return c ? JSON.parse(c) : null; }
      catch(e){ return null; }
    }
    function saveCache(items){ try{ localStorage.setItem(CACHE_KEY, JSON.stringify(items)); }catch(e){} }

    var URL = (window.NIRVANA_SUPABASE_URL||'').trim().replace(/\/+$/,'').replace(/\/rest\/v1$/i,'').replace(/\/+$/,''), KEY = window.NIRVANA_SUPABASE_ANON_KEY;
    var canCloud = URL && KEY && window.supabase && navigator.onLine;

    if (!canCloud){
      var cached = loadFromCache();
      render(cached, true);
      return;
    }

    var client = window.supabase.createClient(URL, KEY);
    client.from('menu').select('*').order('categorie', {ascending:true}).order('nom', {ascending:true})
      .then(function(res){
        if (res.error || !res.data){
          console.warn(res.error && res.error.message);
          render(loadFromCache(), true);
          return;
        }
        saveCache(res.data);
        render(res.data, false);
      })
      .catch(function(e){
        console.warn(e.message);
        render(loadFromCache(), true);
      });
  })();
  </script>
  <script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
</body>
</html>
